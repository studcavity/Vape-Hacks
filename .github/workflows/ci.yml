name: ci

on:
  push:
  pull_request:

# Both Ubuntu releases the sandbox may run on are covered (24.04 now, 26.04 after the upgrade). The
# system Python and shellcheck differ between them, so the repo-config job runs on both as well.
jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      # Tracked files only: setup.sh creates lightning_bugs/.venv, which must not be linted.
      - run: python -m pyflakes $(git ls-files '*.py')
      - run: shellcheck lightning_bugs/tools/setup.sh

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: ubuntu-24.04, python-version: "3.10"}
          - {os: ubuntu-24.04, python-version: "3.12"}
          - {os: ubuntu-26.04, python-version: "3.12"}
          - {os: ubuntu-26.04, python-version: "3.14"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      # Pure-function tests and the simulated-device sync tests: no hardware, no pyocd.
      - run: python -m pytest lightning_bugs/host lightning_bugs/tests/test_lb_flash_unit.py lightning_bugs/tests/test_lb_sync_helpers.py -m "not integration"

  repo-config:
    needs: unit
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      # Drives real git and bash: .gitignore rules, claude_sandbox_deps.yaml schema, setup.sh guard.
      - run: python -m pytest tests

  integration:
    needs: [unit, repo-config]
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      # lb_flash.py end to end (CLI + canary policy) against fake arduino-cli/pyocd. No hardware.
      - run: python -m pytest lightning_bugs/tests/test_lb_flash_integration.py
      # Whole suite once more, exactly as a developer would run it.
      - run: python -m pytest

