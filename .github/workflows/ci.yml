name: ci

on:
  push:
    branches: [main]
  pull_request:

# Both Ubuntu releases the sandbox may run on are covered (24.04 now, 26.04 after the upgrade). The
# system Python and shellcheck differ between them, so the repo-config job runs on both as well.
jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      # Tracked files only: setup.sh creates lightning_bugs/.venv, which must not be linted.
      - run: python -m pyflakes $(git ls-files '*.py')
      - run: shellcheck lightning_bugs/tools/setup.sh

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: ubuntu-24.04, python-version: "3.10"}
          - {os: ubuntu-24.04, python-version: "3.12"}
          - {os: ubuntu-26.04, python-version: "3.12"}
          - {os: ubuntu-26.04, python-version: "3.14"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      # Pure-function tests and the simulated-device sync tests: no hardware, no pyocd.
      - run: python -m pytest lightning_bugs/host lightning_bugs/tests/test_lb_flash_unit.py lightning_bugs/tests/test_lb_sync_helpers.py -m "not integration"

  repo-config:
    needs: unit
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      # Drives real git and bash: .gitignore rules, claude_sandbox_deps.yaml schema, setup.sh guard.
      - run: python -m pytest tests

  integration:
    needs: [unit, repo-config]
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      # lb_flash.py end to end (CLI + canary policy) against fake arduino-cli/pyocd. No hardware.
      - run: python -m pytest lightning_bugs/tests/test_lb_flash_integration.py
      # Whole suite once more, exactly as a developer would run it.
      - run: python -m pytest

  toolchain:
    # Compiles the real firmware for every model and checks its worst-case stack against the model's
    # budget (lightning_bugs/tools/lb_stack.py). Needs arduino-cli + the PY32 core, which setup.sh
    # installs from its own pins (checksum-verified arduino-cli, core PY32Duino:PY32@0.1.3), so the
    # versions are defined in one place. No hardware, no probe.
    needs: unit
    runs-on: ubuntu-24.04
    env:
      LB_REQUIRE_TOOLCHAIN: "1"      # a missing toolchain fails the tests instead of skipping them
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: lightning_bugs/.tools
          key: lb-tools-${{ runner.os }}-${{ hashFiles('lightning_bugs/tools/setup.sh') }}
      # --i-know-this-modifies-my-system: keeps everything under lightning_bugs/.tools (git-ignored).
      - run: bash lightning_bugs/tools/setup.sh --i-know-this-modifies-my-system
      - name: Put the toolchain on PATH for the next steps
        run: |
          tools="$GITHUB_WORKSPACE/lightning_bugs/.tools"
          echo "$tools/bin" >> "$GITHUB_PATH"
          {
            echo "ARDUINO_DIRECTORIES_DATA=$tools/arduino15"
            echo "ARDUINO_DIRECTORIES_USER=$tools/arduino-user"
            echo "ARDUINO_DIRECTORIES_DOWNLOADS=$tools/arduino-downloads"
          } >> "$GITHUB_ENV"
      - run: arduino-cli version && arduino-cli core list
      - run: python lightning_bugs/tools/lb_stack.py --all
      - run: python -m pytest lightning_bugs/tests/test_lb_stack.py -ra
