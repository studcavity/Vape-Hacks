# Tooling installed into the sandbox before the session starts.
# Format: https://github.com/studcavity/claude_sandbox (README: "repo dependencies").
# Install order: apt, binaries, scripts. Runs as root, before any credentials exist.
#
# Only system-level tools live here. The py32duino core, its ARM toolchain and
# the pyocd venv are per-user and are set up by lightning_bugs/tools/setup.sh.
# See lightning_bugs/assessments/toolchain.md.

apt:
  - python3-venv      # setup.sh creates lightning_bugs/.venv for pyocd
  - libusb-1.0-0      # pyocd's USB probe access (Pico/CMSIS-DAP)

# Installed via the official install.sh (pinned to the 0.33.0 tag, sha256 of the
# script) instead of `binaries:`: the launcher's binaries step failed with
# "install: cannot open '/dev/stdin' for reading: Permission denied".
# 0.33.0 is the version py32duino's own CI uses. The script does not itself
# verify the tarball checksum; it downloads from the project's GitHub releases.
scripts:
  - name: arduino-cli
    url: https://raw.githubusercontent.com/arduino/arduino-cli/0.33.0/install.sh
    sha256: 255c3328df2257ff0ef612af167e59186af8a3d18a2c231e4030b53bc8ea47ee
    args: ["0.33.0"]
    env: {BINDIR: /usr/local/bin}

