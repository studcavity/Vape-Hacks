# Tooling installed into the sandbox before the session starts.
# Format: https://github.com/studcavity/claude_sandbox (README: "repo dependencies").
# Install order: apt, binaries, scripts. Runs as root, before any credentials exist.
#
# Only system-level tools live here. The py32duino core, its ARM toolchain and
# the pyocd venv are per-user and are set up by lightning_bugs/tools/setup.sh.
# See lightning_bugs/assessments/toolchain.md.

apt:
  - python3-venv      # setup.sh creates lightning_bugs/.venv for pyocd
  - libusb-1.0-0      # pyocd's USB probe access (Pico/CMSIS-DAP)
  - shellcheck        # lint lightning_bugs/tools/setup.sh (CI does the same)
  - usbutils          # lsusb, to check which host USB devices the sandbox sees
  - poppler-utils     # pdftotext, to search the large PY32F030 datasheet and reference manual PDFs

# arduino-cli is intentionally NOT listed: lightning_bugs/tools/setup.sh installs it (pinned to 0.33.0,
# checked against the release's published checksums) so that one script does the job both here and, with
# its explicit --i-know-this-modifies-my-system opt-in, on a developer's own machine. A `binaries:` entry
# would only cover the sandbox. (The launcher's old put_file `/dev/stdin` bug, which first forced this,
# is fixed, so that is no longer the reason.)

# Runs inside the container as `ubuntu` at the start of every launch (idempotent).
# The script carries a guard: outside a claude_sandbox it refuses unless given --i-know-this-modifies-my-system
# (then it keeps everything under lightning_bugs/.tools). Here it is run with no arguments.
setup:
  - name: lightning-bugs-toolchain
    path: lightning_bugs/tools/setup.sh
    timeout: 1800

