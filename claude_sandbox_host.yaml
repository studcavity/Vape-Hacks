    sha256: ab7f75d95ead0b1efb7432e7f034f9575cc3d23dc1b03d41af1ec253486d19de
    on_error: skip
  - name: cmsis-5.7.0
    host_path: ~/software/CMSIS-5.7.0.tar.bz2
    dest: ~/software/CMSIS-5.7.0.tar.bz2
    sha256: 0b04b0f214e483bcc360cda985cddc0de8031714019ceabcda4770d510b82bfe
