# What this repo asks the HOST to hand to a sandbox at launch. Requests only: nothing is attached
# until the host user approves it (--usb VID:PID, the launcher's prompt, or ~/.config/claude_sandbox/usb_allow).
# Read by claude_sandbox's sandbox_host.py from the default branch; separate from claude_sandbox_deps.yaml
# (old launchers reject unknown keys there). Nothing here affects the image cache.
#
# The one supported probe is the Pico debug probe (CLAUDE.md, "Debug probe"); tests/test_sandbox_host.py guards it.
usb:
  - name: pico-probe
    vendor_id: "2e8a"
    product_id: "000c"
    description: Raspberry Pi Pico debug probe (CMSIS-DAP), SWD to the target
    tools: [pyocd]

# Pre-downloaded toolchain bundles from the host user's ~/software/ (see lightning_bugs/tools/setup.sh for what
# uses them). Every file is optional (on_error: skip): if it is missing or its sha256 differs, the launch goes on
# and setup.sh downloads it itself. Read from the host only with --allow-files or a yes at the launch prompt.
# sha256 are the publishers' own: arduino-cli's 0.33.0-checksums.txt, the SHA-256 fields of package_py32_index.json
# (PY32Duino core, xPack gcc, CMSIS); the Puya pack has no published checksum (hash of our own download).
files:
  - name: arduino-cli-linux-x64
    host_path: ~/software/arduino-cli_0.33.0_Linux_64bit.tar.gz
    dest: ~/software/arduino-cli_0.33.0_Linux_64bit.tar.gz
    sha256: 0eeaba59a345f4d2aab03d4412dd490e5a4db0d006be6c0a72f23df0ed7ecab9
    on_error: skip
  - name: arduino-cli-linux-arm64
    host_path: ~/software/arduino-cli_0.33.0_Linux_ARM64.tar.gz
    dest: ~/software/arduino-cli_0.33.0_Linux_ARM64.tar.gz
    sha256: c7280677cf0cb12cd143813b7e97f832e86b49f8b39ba31ff65189ae1e577a51
    on_error: skip
  - name: py32duino-core-0.1.3
    host_path: ~/software/Arduino-PY32-0.1.3.zip
    dest: ~/software/Arduino-PY32-0.1.3.zip
    sha256: d18af465e4b81b575f009aa08fe77ecb506d2ae21cb96c2fb29c936cc12262c4
    on_error: skip
  - name: xpack-arm-gcc-linux-x64
    host_path: ~/software/xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
    dest: ~/software/xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
    sha256: 1252a8cafe9237de27a765376697230368eec21db44dc3f1edeb8d838dabd530
    on_error: skip
  - name: xpack-arm-gcc-linux-arm64
    host_path: ~/software/xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-arm64.tar.gz
