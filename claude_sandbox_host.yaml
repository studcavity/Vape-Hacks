# What this repo asks the HOST to hand to a sandbox at launch. Requests only: nothing is attached
# until the host user approves it (--usb VID:PID, the launcher's prompt, or ~/.config/claude_sandbox/usb_allow).
# Read by claude_sandbox's sandbox_host.py from the default branch; separate from claude_sandbox_deps.yaml
# (old launchers reject unknown keys there). Nothing here affects the image cache.
#
# The one supported probe is the Pico debug probe (CLAUDE.md, "Debug probe"); tests/test_sandbox_host.py guards it.
usb:
  - name: pico-probe
    vendor_id: "2e8a"
    product_id: "000c"
    description: Raspberry Pi Pico debug probe (CMSIS-DAP), SWD to the target
    tools: [pyocd]
