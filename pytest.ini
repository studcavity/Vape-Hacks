[pytest]
testpaths = lightning_bugs/host lightning_bugs/tests tests
# lb_sync.py lives in lightning_bugs/host, lb_flash.py in lightning_bugs/tools.
pythonpath = lightning_bugs/host lightning_bugs/tools
markers =
    toolchain: compiles the real firmware with arduino-cli (skipped when it or the core is missing)
    integration: drives real scripts/processes (git, bash) rather than calling functions
